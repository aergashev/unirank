# Local stack. `docker compose up -d db` is enough for `npm run dev`;
# `docker compose --profile web up -d --build` also migrates, seeds and runs the
# production image on :3300.

name: unirank

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unirank
      POSTGRES_DB: unirank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unirank"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies migrations and seeds universities + the first admin.
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://unirank:${POSTGRES_PASSWORD}@db:5432/unirank
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["web"]

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://unirank:${POSTGRES_PASSWORD}@db:5432/unirank
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["web"]

volumes:
  db-data:
